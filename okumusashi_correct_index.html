<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>毛呂山総合公園〜吾野駅 距離・ゴール予測</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;background:#f4f6f5;color:#1f2937}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(820px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}.sub,.info,.note{color:#6b7280;line-height:1.7}.section{margin-top:24px;padding-top:22px;border-top:1px solid #d1d5db}.title{font-size:20px;font-weight:800;margin-bottom:14px}label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;font-size:18px;padding:14px;border:1px solid #d1d5db;border-radius:12px;background:#fff}.time24{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.time24 span{font-size:24px;font-weight:800;text-align:center}.time24 select{min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.result,.goal{margin-top:18px;border-radius:16px;padding:24px;text-align:center}.result{background:#eaf2ff}.goal{background:#ecfdf5}.small{color:#6b7280;font-size:15px}.distance{font-size:clamp(42px,8vw,64px);font-weight:800;color:#2563eb;margin:8px 0}.goalTime{font-size:clamp(40px,8vw,60px);font-weight:800;color:#0f766e;margin:8px 0}.point{font-size:18px;font-weight:700}.info{margin-top:24px;font-size:14px}.note{margin-top:10px;font-size:13px}@media(max-width:640px){.card{padding:20px}.grid{grid-template-columns:1fr}select,input{font-size:16px}}</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#075f3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奥武蔵練習会">
</head><body><div class='wrap'><main class='card'><h1>毛呂山総合公園〜吾野駅</h1><div class='sub'>地点までの距離表示と、スタート時刻＋途中地点の通過時刻からゴール「吾野駅」の予測時刻を計算します。</div><section class='section'><div class='title'>① 地点までの距離</div><label for='pointSelect'>地点を選択</label><select id='pointSelect'><option value=''>-- 地点を選んでください --</option><option value='3'>① 鎌北湖第2駐車場（往路）</option><option value='5'>② 八坂神社（往路）</option><option value='9.2'>③ 滝の入AS（往路）</option><option value='14'>④ 桂木AS</option><option value='18'>⑤ 滝の入（復路）</option><option value='21.8'>⑥ 八坂神社（復路）</option><option value='24'>⑦ 鎌北湖第2駐車場</option><option value='26'>⑧ 清流AS</option><option value='26.3'>⑨ 北向地蔵</option><option value='28.2'>⑩ ユガテAS</option><option value='29.1'>⑪ 天文岩</option><option value='31.3'>⑫ 一本杉峠</option><option value='32.9'>⑬ 宗林禅寺</option><option value='34'>⑭ ヘアピン</option><option value='38'>⑮ 吾野駅</option></select><div class='result'><div class='small'>スタート地点からの距離</div><div class='distance' id='distance'>-- km</div><div class='point' id='pointName'>地点を選択してください</div></div></section><section class='section'><div class='title'>② ゴール予測時刻</div><div class='grid'><div><label>スタート時刻（24時間表示）</label><div class='time24'><select id='startHour' aria-label='スタート時'><option value=''>時</option></select><span>:</span><select id='startMinute' aria-label='スタート分'><option value=''>分</option></select></div></div><div><label>途中地点の通過時刻（24時間表示）</label><div class='time24'><select id='checkpointHour' aria-label='通過時'><option value=''>時</option></select><span>:</span><select id='checkpointMinute' aria-label='通過分'><option value=''>分</option></select></div></div></div><div class='goal'><div class='small'>予測ゴール時刻（吾野駅）</div><div class='goalTime' id='goalTime'>--:--</div><div id='paceInfo' class='sub'>スタート時刻・途中地点・通過時刻を入力してください</div></div><div class='note'>※ 通過地点までの平均ペースが、その後も同じと仮定して38km地点の到着時刻を予測します。</div></section><div class='info'>コース名：毛呂山総合公園 → 鎌北湖 → 阿諏訪 → 桂木 → 鎌北湖 → 吾野駅<br>全体の距離：38 km</div></main></div><script>const TOTAL=38,ps=document.getElementById('pointSelect'),d=document.getElementById('distance'),pn=document.getElementById('pointName');ps.addEventListener('change',function(){if(!this.value){d.textContent='-- km';pn.textContent='地点を選択してください'}else{d.textContent=this.value+' km';pn.textContent=this.options[this.selectedIndex].text}update()});const sh=document.getElementById('startHour'),sm=document.getElementById('startMinute'),ch=document.getElementById('checkpointHour'),cm=document.getElementById('checkpointMinute'),gt=document.getElementById('goalTime'),pi=document.getElementById('paceInfo');function fillTime(){for(let h=0;h<24;h++){const v=String(h).padStart(2,'0');sh.add(new Option(v,v));ch.add(new Option(v,v))}for(let m=0;m<60;m++){const v=String(m).padStart(2,'0');sm.add(new Option(v,v));cm.add(new Option(v,v))}}function selectedMins(h,m){if(h.value===''||m.value==='')return null;return Number(h.value)*60+Number(m.value)}function clock(x){x=Math.round(x);const day=Math.floor(x/1440);let m=x%1440;if(m<0)m+=1440;const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')+(day>0?'（翌日）':'')}function pace(p){let mi=Math.floor(p),se=Math.round((p-mi)*60);if(se===60){mi++;se=0}return mi+'分'+String(se).padStart(2,'0')+'秒/km'}function update(){const s=selectedMins(sh,sm);let c=selectedMins(ch,cm);const dist=parseFloat(ps.value);if(s===null||c===null||!dist){gt.textContent='--:--';pi.textContent='スタート時刻・地点・通過時刻を入力してください';return}if(c<s)c+=1440;const e=c-s;if(e<=0){gt.textContent='--:--';pi.textContent='通過時刻はスタート時刻より後にしてください';return}const p=e/dist;gt.textContent=clock(s+p*TOTAL);pi.textContent='ここまでの平均ペース：'+pace(p)+' ／ 経過時間：'+Math.floor(e/60)+'時間'+(e%60)+'分'}fillTime();[sh,sm,ch,cm].forEach(x=>x.addEventListener('change',update));</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {updateViaCache:'none'})
      .then(reg => reg.update())
      .catch(console.error);
  });
}
</script>
</body></html>
